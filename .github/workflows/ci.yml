name: CI

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ci.yml
      - mise.toml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/**
      - plans/**

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Set Timezone
        run: sudo timedatectl set-timezone "Asia/Shanghai"

      - uses: actions/checkout@v7

      - name: Setup tools
        uses: jdx/mise-action@v5

      - name: Install
        run: pnpm install --frozen-lockfile

